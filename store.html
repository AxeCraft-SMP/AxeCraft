<script>
let cart=[];
function add(name,price){
 cart.push({name,price});
 render();
}
function render(){
 let items=document.getElementById('items');
 let total=0;
 if(cart.length===0){
  items.innerHTML='Your cart is empty.';
 }else{
  items.innerHTML=cart.map((item,i)=>{
   total+=item.price;
   return `<div>${item.name} - $${item.price} <button onclick="removeItem(${i})" style="background:#263d58;color:white;padding:5px 9px">✖</button></div>`;
  }).join('');
 }
 document.getElementById('total').innerText=total;
}
function removeItem(i){
 cart.splice(i,1);
 render();
}
function clearCart(){
 cart=[];
 render();
}
