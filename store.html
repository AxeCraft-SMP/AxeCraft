
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AxeCraft Store</title>
<style>
body{background:#090710;color:white;font-family:Arial;text-align:center;padding:20px}
h1{color:#ff8425;font-size:42px}
.products{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:15px;max-width:850px;margin:30px auto}
.card{background:#1b1424;border:1px solid #633d48;border-radius:15px;padding:20px}
.price{color:#ff8425;font-size:24px;font-weight:bold}
button,a{background:#ff8425;color:#100710;padding:12px 18px;border:0;border-radius:8px;text-decoration:none;font-weight:bold;cursor:pointer}
</style>
</head>
<body>
<h1>🎃 AXECRAFT STORE</h1>
<p>Choose your favorite items!</p>
<div class="products" id="products"></div>
<h2>🛒 Cart: <span id="count">0</span></h2>
<h3>Total: $<span id="total">0</span></h3>
<div id="cart"></div>
<a href="index.html">HOME</a>
<script>
const items=[
["VIP",7,"💎"],["MVP",5,"👑"],["Friends",4,"🤝"],
["Vote Crate",1,"🎁"],["Spawner Crate",13,"⚙️"],
["Crystal Crate",10,"💠"],["Asura Crate",15,"🔥"],
["Halloween Crate",14,"🎃"]
];
let cart=[];
function render(){
document.getElementById("products").innerHTML=items.map((p,i)=>
`<div class="card"><h2>${p[2]} ${p[0]}</h2><p class="price">$${p[1]}</p><button onclick="add(${i})">Add to cart</button></div>`).join("");
}
function add(i){cart.push(items[i]);update()}
function remove(i){cart.splice(i,1);update()}
function update(){
document.getElementById("count").textContent=cart.length;
document.getElementById("total").textContent=cart.reduce((s,p)=>s+p[1],0);
document.getElementById("cart").innerHTML=cart.map((p,i)=>
`<p>${p[0]} - $${p[1]} <button onclick="remove(${i})">X</button></p>`).join("");
}
render();
</script>
</body>
</html>
